<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>xp dev</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="xp.css">
<style>
  body { margin: 0; background: linear-gradient(180deg, #0b0f19 0%, #111827 100%); color: #dbe4f0; font-family: Inter, sans-serif; }
  .frame { width: 1920px; min-height: 1080px; padding: 40px 60px; box-sizing: border-box; border-bottom: 2px dashed #334155; position: relative; }
  .frame h2 { font-family: Outfit, sans-serif; font-size: 50px; margin: 0 0 20px 0; color: #f8fafc; }
</style>
</head>
<body>
<!-- dev.html?w=nyquist&w=ptc : one 1920 x 1080 frame per widget. Extra data-* attributes: dev.html?w=redline&focus=3 -->
<div id="frames"></div>
<script>
  window.XP_DEV = true;
  const q = new URLSearchParams(location.search);
  for (const name of q.getAll("w")) {
    const f = document.createElement("section"); f.className = "frame";
    f.innerHTML = `<h2>${name}</h2>`;
    const d = document.createElement("div"); d.className = "xp"; d.dataset.xp = name;
    for (const [k, v] of q.entries()) if (k !== "w") d.dataset[k] = v;
    f.append(d); document.getElementById("frames").append(f);
  }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
