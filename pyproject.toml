[project]
name = "public-presentations"
version = "0.1.0"
description = "Public presentations"
requires-python = ">=3.10"
dependencies = [
    "jupyter>=1.0.0",
    "nbformat>=5.7",
    "ipykernel>=6.0",
    # NOTE: the PyPI `d2l` package is deliberately NOT a dependency. It is
    # abandoned (1.0.3, Aug 2023) and hard-pins requests==2.31.0 (CVE-vulnerable)
    # plus numpy/matplotlib/pandas/scipy at 2023 versions. Every deck that does
    # `import d2l` resolves to the vendored `d2l.py` sitting in its own unit
    # folder, so nothing needs the upstream package. The direct imports of that
    # vendored module are declared explicitly below (pillow, matplotlib-inline).
    "numpy>=1.23.5",
    "scipy>=1.10.1",
    "matplotlib>=3.7.2",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "scikit-learn>=1.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "seaborn>=0.12.0",
    "plotly>=5.15.0",
    "ipywidgets>=8.0.0",
    "notebook>=7.0.0",
    "jupyterlab>=4.0.0",
    "h5py>=3.10.0",
    "tqdm>=4.67.1",
    "scikit-image>=0.21.0",
    # Direct imports of the vendored d2l.py modules (previously satisfied
    # transitively via the upstream d2l package).
    "pillow>=12.3.0",
    "matplotlib-inline>=0.1.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
] 